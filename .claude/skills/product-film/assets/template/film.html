<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* ── PRODUCT FILM STAGE ─────────────────────────────────────────────
     Every frame is a pure function of time: window.seek(t) computes all
     opacity/transform/canvas state from t. NO CSS animations/transitions
     anywhere — that is what makes the render deterministic and scrub-
     perfect. Replace the demo scenes with your storyboard; keep the
     machinery (easing kit, words, grain, vignette, fade, filmReady).
     Stage size comes from timings.js (width/height) so the same file
     serves 16:9, 9:16, 1:1, 4:5 — restage layouts per aspect.        */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* Swap this palette for the product's brand. Keep the dark-stage +
       glowing-accent formula: it is what makes UI mockups read as film. */
    --bg: #0A0D13; --ink: #E9EDF4; --dim: #8C94A6; --acc: #4E9BFF;
    --card: #FFFFFF; --cink: #1A2334; --cdim: #5E6B80; --chair: rgba(20,40,80,.13);
    --panel: #F3F6FB; --moss: #1E8E53;
  }
  html, body { background: #000; }
  #stage {
    position: relative; overflow: hidden; background: var(--bg);
    font-family: "Inter Variable", "Inter", sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased;
    /* width/height set from TIMING at boot */
  }
  .scene { position: absolute; inset: 0; opacity: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .glow { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(54% 62% at 50% 42%, rgba(78,155,255,.11), transparent 72%); }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 40;
    background: radial-gradient(118% 118% at 50% 46%, transparent 58%, rgba(0,0,0,.44) 100%); }
  #grain { position: absolute; inset: 0; z-index: 41; opacity: .05; pointer-events: none; }
  #fade { position: absolute; inset: 0; z-index: 50; background: #000; opacity: 0; pointer-events: none; }

  /* Type scale (landscape 1080p). For 9:16, bump sizes ~1.25× and
     tighten max-widths — see references/formats.md restage notes. */
  .h-xl { font-size: 116px; font-weight: 640; letter-spacing: -0.035em; line-height: 1.06; text-align: center; font-variation-settings: "wght" 640; }
  .h-lg { font-size: 86px;  font-weight: 620; letter-spacing: -0.03em;  line-height: 1.1;  text-align: center; font-variation-settings: "wght" 620; }
  .h-md { font-size: 58px;  font-weight: 600; letter-spacing: -0.025em; text-align: center; font-variation-settings: "wght" 600; }
  .sub  { font-size: 29px; color: var(--dim); letter-spacing: -0.01em; font-weight: 450; font-variation-settings: "wght" 450; }
  .kick { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 20px; font-weight: 700; letter-spacing: .15em; color: var(--acc); }
  .word { display: inline-block; opacity: 0; transform: translateY(34px); will-change: transform, opacity; }
  .accent { color: var(--acc); }

  /* Generic light app-window mockup — the "product as hero" card.     */
  .appwin { position: relative; background: var(--card); color: var(--cink);
    border-radius: 18px; box-shadow: 0 50px 130px rgba(0,0,0,.62);
    overflow: hidden; text-align: left; opacity: 0; }
  .appwin .bar { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--chair); position: relative; }
  .dot { width: 13px; height: 13px; border-radius: 7px; flex: none; }
  .dot.r { background: #F26D5F; } .dot.y { background: #F5BE4F; } .dot.g { background: #61C454; }
  .appwin .ttl { position: absolute; left: 0; right: 0; text-align: center; font-size: 15px; color: var(--cdim); font-weight: 550; }
  .row { display: flex; align-items: center; gap: 14px; padding: 16px 28px; font-size: 18px; font-weight: 540; opacity: 0; }
  .row + .row { border-top: 1px solid var(--chair); }
  .row .cdot { width: 9px; height: 9px; border-radius: 5px; background: var(--acc); flex: none; }
  .row .tag { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--cdim); background: var(--panel); border-radius: 6px; padding: 3px 9px; flex: none; }
</style>
<script src="timings.js"></script>
</head>
<body>
<div id="stage">
  <div class="glow" id="glow"></div>

  <!-- ── DEMO SCENES: replace with your storyboard ──────────────── -->
  <div class="scene" id="s1"><div class="h-lg" id="s1text" style="max-width:86%"></div></div>

  <div class="scene" id="s2">
    <div class="kick" style="margin-bottom:40px" id="s2kick">THE PRODUCT</div>
    <div class="appwin" id="appwin" style="width:64%">
      <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="ttl">Your Product</span></div>
      <div class="row"><span class="cdot"></span>The first thing it does<span class="tag">fast</span></div>
      <div class="row"><span class="cdot"></span>The second thing it does<span class="tag">simple</span></div>
      <div class="row"><span class="cdot"></span>The moment that matters<span class="tag">yours</span></div>
    </div>
  </div>

  <div class="scene" id="s3">
    <canvas id="endMark" width="380" height="380" style="width:190px;height:190px;margin-bottom:36px"></canvas>
    <div class="h-xl" id="endLine"></div>
    <div class="sub" id="endSub" style="margin-top:34px; opacity:0">The one-line positioning goes here.</div>
  </div>

  <div id="vignette"></div>
  <canvas id="grain"></canvas>
  <div id="fade"></div>
</div>

<script>
const T = window.TIMING;
const W = T.width || 1920, H = T.height || 1080;
const $ = id => document.getElementById(id);
const stage = $("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";
const grain = $("grain");
grain.width = Math.round(W / 2); grain.height = Math.round(H / 2);
grain.style.width = W + "px"; grain.style.height = H + "px";

/* ── easing kit — this carries the whole look ───────────────────── */
const clamp01 = x => Math.max(0, Math.min(1, x));
const easeInOut = x => { x = clamp01(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const expoOut = x => clamp01(x) === 1 ? 1 : 1 - Math.pow(2, -10 * clamp01(x));
/* scene-opacity window: fade in over fi after a, fade out over fo before b */
const win = (t, a, b, fi = .5, fo = .5) => clamp01((t - a) / fi) * clamp01((b - t) / fo);
const lerp = (a, b, p) => a + (b - a) * p;
function hash(n) { const s = Math.sin(n) * 43758.5453123; return s - Math.floor(s); }

/* ── word-by-word keynote reveal ────────────────────────────────── */
function words(el, text) {
  el.innerHTML = "";
  const list = [];
  text.split(" ").forEach(w => {
    const s = document.createElement("span");
    s.className = "word";
    s.innerHTML = w + "&nbsp;";
    el.appendChild(s);
    list.push(s);
  });
  return list;
}
function revealWords(list, t, start, per = 0.09, dur = 0.55, dy = 34) {
  list.forEach((s, i) => {
    const p = expoOut((t - start - i * per) / dur);
    s.style.opacity = p;
    s.style.transform = `translateY(${(1 - p) * dy}px)`;
  });
}
const s1words = words($("s1text"), "One sentence of problem or promise.");
const endWords = words($("endLine"), "Product Name.");

/* ── simple brand-mark painter (replace with the real mark) ─────── */
function drawMark(ctx, size, t, p) {
  const c = size / 2;
  ctx.clearRect(0, 0, size, size);
  if (p <= 0) return;
  const R = size * 0.34;
  const sweep = easeInOut(clamp01(p)) * 2 * Math.PI * 0.86;
  ctx.beginPath();
  for (let a = -1.2; a <= -1.2 + sweep; a += 0.03) {
    const r = R * (1 + 0.04 * Math.sin(a * 5 - t * 0.5));
    a <= -1.17 ? ctx.moveTo(c + Math.cos(a) * r, c + Math.sin(a) * r)
               : ctx.lineTo(c + Math.cos(a) * r, c + Math.sin(a) * r);
  }
  ctx.lineWidth = size * 0.05; ctx.lineCap = "round";
  ctx.strokeStyle = "#4E9BFF";
  ctx.shadowColor = "#4E9BFF"; ctx.shadowBlur = size * 0.04;
  ctx.stroke(); ctx.shadowBlur = 0;
}

/* ── deterministic film grain (prevents x264 banding on darks) ──── */
const grainCtx = grain.getContext("2d");
function drawGrain(frame) {
  const w = grain.width, h = grain.height;
  const img = grainCtx.createImageData(w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = hash(i * 0.017 + frame * 977.131) * 255;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 26;
  }
  grainCtx.putImageData(img, 0, 0);
}

/* ── master seek: every frame derives from t ────────────────────── */
window.seek = function (t) {
  const S = T.scenes;
  const keys = Object.keys(S);
  const inS = k => t >= S[k][0] && t < S[k][1];
  keys.forEach(k => { const el = $(k); if (el) el.style.opacity = 0; });

  $("glow").style.opacity = 0.25 + 0.45 * clamp01(t / 3);

  if (inS("s1")) {
    $("s1").style.opacity = win(t, S.s1[0], S.s1[1], 0.01, 0.45);
    revealWords(s1words, t, T.beats.headline, 0.11, 0.6);
  }
  if (inS("s2")) {
    $("s2").style.opacity = win(t, S.s2[0], S.s2[1], 0.3, 0.4);
    const kp = expoOut((t - T.beats.card_in - 0.2) / 0.5);
    $("s2kick").style.opacity = kp;
    const wp = expoOut((t - T.beats.card_in) / 0.8);
    $("appwin").style.opacity = wp;
    $("appwin").style.transform = `translateY(${(1 - wp) * 60}px) scale(${0.97 + wp * 0.03})`;
    document.querySelectorAll("#appwin .row").forEach((r, i) => {
      const p = expoOut((t - T.beats.rows[i]) / 0.45);
      r.style.opacity = p;
      r.style.transform = `translateY(${(1 - p) * 14}px)`;
    });
  }
  if (inS("s3")) {
    $("s3").style.opacity = win(t, S.s3[0], S.s3[1], 0.35, 0.01);
    drawMark($("endMark").getContext("2d"), 380, t, easeInOut((t - T.end.mark) / 1.0));
    revealWords(endWords, t, T.end.line, 0.14, 0.6);
    $("endSub").style.opacity = expoOut((t - T.end.sub) / 0.7);
  }

  /* global fade out + fade in from black */
  $("fade").style.opacity = clamp01((t - T.end.fade) / (T.duration - T.end.fade - 0.05));
  if (t < 0.6) $("fade").style.opacity = Math.max(parseFloat($("fade").style.opacity), 1 - t / 0.6);

  drawGrain(Math.floor(t * T.fps));
  return document.fonts.status;
};
window.filmReady = document.fonts.ready.then(() => { window.seek(0); return true; });
</script>
</body>
</html>
